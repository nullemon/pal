# Production-like stack for PALScans. Not used on the build machine (no Docker daemon there);
# the local services on 5433/6379 stand in. See RUNBOOK.md.
name: palscans

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://pal:${POSTGRES_PASSWORD:-pal}@postgres:5432/palscans
  REDIS_URL: redis://valkey:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: palscans
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-palscans}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-palscans-dev-secret}
  S3_REGION: auto
  PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-http://localhost:9000/palscans}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  SITE_NAME: PALScans
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pal}
      POSTGRES_DB: palscans
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pal -d palscans"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-palscans}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-palscans-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket and make cover/page prefixes publicly readable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/palscans &&
        mc anonymous set download local/palscans/covers &&
        mc anonymous set download local/palscans/pages &&
        echo "bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-palscans}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-palscans-dev-secret}

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - minio

volumes:
  pgdata:
  valkeydata:
  miniodata:
  caddydata:
  caddyconfig:
