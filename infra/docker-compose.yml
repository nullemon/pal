# Production-like stack for PALScans. Not used on the build machine (no Docker daemon there);
# the local services on 5433/6379 stand in. See RUNBOOK.md.
name: palscans

# Only bootstrap values belong here. Storage keys, SMTP, OAuth, Stripe, Turnstile, push and
# the Discord bot are entered in Admin → System → Integrations instead (docs/19).
#
# This file does NOT read the repo-root .env on its own: compose takes its project directory
# from the first -f argument, so it would look in infra/. Always run it as
#   docker compose --env-file .env -f infra/docker-compose.yml …
# from the repo root. Every value below that has no safe default uses `:?` so a missing one
# stops the deploy with its own name, rather than starting a subtly wrong site.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://pal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/palscans
  REDIS_URL: redis://valkey:6379
  SITE_URL: ${SITE_URL:?set SITE_URL (https:// in production)}
  SITE_NAME: ${SITE_NAME:-PALScans}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  # Required in production with no fallback (apps/web/lib/env.ts). Without it the web
  # container refuses to boot and restarts forever.
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET}
  # The worker reaches the web app for cache revalidation over the internal network, not out
  # through the CDN and back.
  INTERNAL_URL: http://web:3000
  # Seals the panel-stored credentials. Falls back to SESSION_SECRET, but then rotating
  # sessions makes stored credentials unreadable — set it separately.
  CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
  # Storage and mail are configured in the admin panel. These are only the fallbacks used
  # before anything is saved there; the defaults deliberately point nowhere rather than at a
  # local folder, because an unnoticed `fs` driver writes uploads into the container and
  # loses them on the next deploy.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-auto}
  PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-}
  # Where the client address comes from. `cloudflare` when Cloudflare proxies the origin,
  # `xff` when only Caddy is in front — guessing wrong puts every reader in one rate-limit
  # bucket and records the proxy's address everywhere, silently, so it must be stated.
  TRUSTED_PROXY: ${TRUSTED_PROXY:?set TRUSTED_PROXY (cloudflare or xff)}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pal}
      POSTGRES_DB: palscans
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pal -d palscans"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # noeviction, not allkeys-lru: this instance backs BullMQ as well as the session and
    # rate-limit caches, and BullMQ requires that its keys are never evicted. Under LRU the
    # server drops job hashes and the wait/active lists under memory pressure, so queued work
    # simply disappears with no error — and import.run, notify.new_chapter and notify.comment
    # have no database safety net to pick them back up.
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Self-hosted alternative to Cloudflare R2. Not started by default: bring it up with
  # `--profile selfhosted`, and set S3_ENDPOINT/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY to match.
  minio:
    profiles: [selfhosted]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-palscans}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-palscans-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket and make the publicly-served prefixes anonymously readable.
  # These are exactly the prefixes the browser fetches from PUBLIC_CDN_URL (see docs/18 §2):
  # covers/ and banners/ (series art), pages/ (chapter images) and avatars/ (reader avatars).
  # `uploads/` (raw originals), `sitemaps/` and `_healthcheck/` are deliberately left private.
  # Per-prefix anonymous access is a MinIO feature; R2 has no equivalent, which is why the R2
  # deployment restricts the CDN hostname with a WAF rule instead.
  minio-init:
    profiles: [selfhosted]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/palscans &&
        mc anonymous set download local/palscans/covers &&
        mc anonymous set download local/palscans/banners &&
        mc anonymous set download local/palscans/pages &&
        mc anonymous set download local/palscans/avatars &&
        echo "bucket ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-palscans}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-palscans-dev-secret}

  # A mail catcher for development. Production points at a real sender from the admin panel.
  mailpit:
    profiles: [selfhosted]
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI
      - "127.0.0.1:1025:1025"   # SMTP

  web:
    init: true
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "3000"
      # Web processes inside this container (apps/web/scripts/serve.mjs). Unset means one per
      # core, which is the point: `next start` is a single Node process and React server
      # rendering is synchronous, so one process serves ~30 reader pages a second no matter
      # how many cores the box has — docs/20 measured 1.07 of 4 cores busy with three idle.
      # Still one container, one port and one health check; the cluster primary shares the
      # listening socket, so nothing above this line changes. Lower it on a small box: each
      # worker is a full Next server at ~200-250 MB.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # Shallow on purpose: "can this process serve a request that reaches the database".
      # Integration state belongs on the Integrations screen, not in a restart loop.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Exactly one of these, always. Unlike `web` it must never be scaled or clustered: it holds
  # the publish scheduler, the view-stats rollup and the nightly backup on interval timers
  # (apps/worker/src/index.ts), and N copies would run each of them N times — N dumps a night,
  # N rollups racing over the same rows. Extra *job* throughput is WORKER_CONCURRENCY inside
  # this one process, not more processes.
  worker:
    init: true
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      # The nightly database dump (docs/18 §9). Deliberately *not* in x-app-env: only the
      # worker takes a dump, so the key that can write to the backups bucket never reaches
      # the web container. With BACKUP_S3_BUCKET unset the job records "not configured" on
      # Admin → System → Backup rather than inventing a destination.
      #
      # This must be the SECOND bucket from docs/18 §2 — the one with no custom domain. The
      # job refuses to write into the bucket the public cdn. hostname is attached to.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      # Default to the app's R2 endpoint/keys; set these when the token is scoped per bucket
      # (an R2 token scoped to `palscans` cannot write to `palscans-backups`).
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # Or write dumps to a mounted directory instead of a bucket.
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      WORKER_BACKUP_MS: ${WORKER_BACKUP_MS:-86400000}
      # The nightly full sitemap rebuild (docs/12 §5). Incremental builds are enqueued by the
      # publish path itself and need no schedule.
      WORKER_SITEMAP_MS: ${WORKER_SITEMAP_MS:-86400000}
      # How long in-flight jobs get on SIGTERM. `stop_grace_period` below must exceed it —
      # Docker's default grace is 10 s, which is shorter than one chapter encode.
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    stop_grace_period: 45s
    healthcheck:
      # The worker answers no requests, so there is nothing to probe: it writes a heartbeat
      # file after every scheduler tick that completed and this reads it (docs/12 §5 has the
      # publish path; apps/worker/src/lib/health.ts has the reasoning). Alive-but-wedged — the
      # tick throwing on every pass because Postgres is refusing connections — was invisible
      # before this, because the container was still up and the process was still running.
      #
      # Nothing restarts the container on a failure (plain compose only reports), which is the
      # behaviour we want: restarting a worker does not fix a database that is down.
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The first tick has to finish before there is anything to read, and it runs after the
      # credential read and the queue connect.
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  valkeydata:
  miniodata:
  caddydata:
  caddyconfig:
