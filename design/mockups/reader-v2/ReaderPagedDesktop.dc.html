    html, body { background: #0b0a10; }

    a { color: #c4b5fd; text-decoration: none; } a:hover { color: #ddd6fe; }
    *, *::before, *::after { box-sizing: border-box; }
    kbd { font-family: inherit; }
    .ibtn { color: #9e97b8; transition: background .15s ease, color .15s ease; }
    .ibtn:hover { background: rgba(255,255,255,.06); color: #ece9f4; }
    .sel { color: #ece9f4; transition: border-color .15s ease, background .15s ease; }
    .sel:hover { border-color: #8b5cf6; background: #1d1829; color: #ece9f4; }
    .sel:hover svg { color: #a78bfa; }
    .zone { transition: background .2s ease; }
    .zone svg { transition: opacity .2s ease; }
    .zone-l:hover { background: linear-gradient(90deg, rgba(139,92,246,.10), rgba(139,92,246,0)); }
    .zone-r:hover { background: linear-gradient(270deg, rgba(139,92,246,.10), rgba(139,92,246,0)); }
    .zone:hover svg { opacity: .35 !important; }
    .tick { transition: background .15s ease, height .15s ease; }
    .tick:hover { background: #a78bfa; height: 12px; }
  </style>
</helmet>
