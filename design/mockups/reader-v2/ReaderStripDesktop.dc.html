<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    html, body { background: #0b0a10; }
    body { margin: 0; }
    a { color: #c4b5fd; text-decoration: none; } a:hover { color: #ddd6fe; }
    * { box-sizing: border-box; }
    .ib:hover { background: #221c33; }
    .btn:hover { background: #221c33; border-color: #3a3152; }
    .sel:hover { background: #221c33; border-color: #3a3152; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; min-height: 1000px; background: #0b0a10; color: #ece9f4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;">

  <!-- Reading strip: 820px column, centred, pages touch (zero gap, zero radius) -->
  <div style="position: absolute; left: 310px; top: 59px; width: 820px; display: flex; flex-direction: column; gap: 0; z-index: 1;">

    <!-- Page 6 -->
    <div style="position: relative; width: 820px; height: 410px; border-radius: 0; background: linear-gradient(180deg, #1a1626, #14111f); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 30px 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1.3fr 1fr; gap: 18px;">
      <div style="grid-column: 1 / -1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
    </div>

    <!-- Page 7 (labelled) -->
    <div style="position: relative; width: 820px; height: 410px; border-radius: 0; background: linear-gradient(180deg, #1a1626, #14111f); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 30px 34px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 1fr 1.15fr; gap: 18px;">
      <div style="grid-column: 1 / 3; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="grid-column: 1 / -1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div class="num" style="position: absolute; right: 14px; bottom: 10px; font-size: 12px; font-weight: 500; line-height: 16px; color: #9e97b8; opacity: .75; letter-spacing: .02em;">7 / 34</div>
    </div>

    <!-- Page 8 (start, cut by the bottom bar / frame) -->
    <div style="position: relative; width: 820px; height: 410px; border-radius: 0; background: linear-gradient(180deg, #1a1626, #14111f); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); padding: 30px 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1fr 1fr; gap: 18px;">
      <div style="grid-row: 1 / -1; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
      <div style="background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);"></div>
    </div>
  </div>

  <!-- Left skyscraper, sticky in the gutter, vertically centred -->
  <div style="position: absolute; left: 75px; top: 200px; width: 160px; height: 600px; border: 1px dashed #3a3152; background: rgba(31,26,44,.45); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 14px; font-size: 11px; line-height: 18px; font-weight: 500; font-variant: small-caps; letter-spacing: .08em; color: #9e97b8; z-index: 2;">AD · Skyscraper 160×600 · sticky</div>

  <!-- Right skyscraper -->
  <div style="position: absolute; left: 1205px; top: 200px; width: 160px; height: 600px; border: 1px dashed #3a3152; background: rgba(31,26,44,.45); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 14px; font-size: 11px; line-height: 18px; font-weight: 500; font-variant: small-caps; letter-spacing: .08em; color: #9e97b8; z-index: 2;">AD · Skyscraper 160×600 · sticky</div>

  <!-- Top bar 56px -->
  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 56px; background: rgba(16,13,23,.94); border-bottom: 1px solid #2c2540; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 3;">
    <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <a class="ib" href="#" title="Back to series" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #9e97b8;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
        <div style="font-size: 14px; font-weight: 600; line-height: 18px; color: #ece9f4; white-space: nowrap;">Return of the Frost Monarch</div>
        <div style="font-size: 12px; font-weight: 500; line-height: 16px; color: #9e97b8;">Chapter 301</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div class="num" style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; background: #181423; border: 1px solid #2c2540; font-size: 13px; font-weight: 500; color: #9e97b8; letter-spacing: .02em;">7 / 34</div>
      <a class="ib" href="#" title="Reader settings" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #9e97b8;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </a>
      <a class="ib" href="#" title="Comments" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #9e97b8;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </a>
    </div>
  </div>

  <!-- Progress bar 3px, ~20% read -->
  <div style="position: absolute; left: 0; top: 56px; width: 1440px; height: 3px; background: rgba(139,92,246,.14); z-index: 3;">
    <div style="width: 20%; height: 3px; background: #8b5cf6;"></div>
  </div>

  <!-- Bottom bar 60px -->
  <div style="position: absolute; left: 0; top: 940px; width: 1440px; height: 60px; background: rgba(16,13,23,.94); border-top: 1px solid #2c2540; display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 3;">
    <a class="btn" href="#" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 18px 0 12px; border-radius: 10px; background: #181423; border: 1px solid #2c2540; color: #ece9f4; font-size: 14px; font-weight: 600; line-height: 1;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9e97b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Prev</span>
    </a>
    <a class="sel" href="#" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; width: 220px; padding: 0 12px 0 16px; border-radius: 10px; background: #181423; border: 1px solid #2c2540; color: #ece9f4; font-size: 14px; font-weight: 600; line-height: 1;">
      <span>Chapter 301</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9e97b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
    <a class="btn" href="#" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px 0 18px; border-radius: 10px; background: #181423; border: 1px solid #2c2540; color: #ece9f4; font-size: 14px; font-weight: 600; line-height: 1;">
      <span>Next</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9e97b8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
  </div>

</div>
</x-dc>
</body>
</html>
