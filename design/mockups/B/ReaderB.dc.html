<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    html, body { background: #0b0a10; }
    body { margin: 0; }
    a { color: #c4b5fd; text-decoration: none; } a:hover { color: #ddd6fe; }
    * { box-sizing: border-box; }
    .ib { color: #efedf6; } .ib:hover { background: rgba(139,92,246,.14); color: #efedf6; }
    .pill-btn { color: #efedf6; } .pill-btn:hover { background: rgba(139,92,246,.14); color: #efedf6; }
    .pill-sel { color: #c4b5fd; } .pill-sel:hover { background: rgba(139,92,246,.24); color: #ddd6fe; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #0b0a10; color: #efedf6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; position: relative;">

  <!-- Reading progress -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.08); z-index: 6;">
    <div style="width: 20%; height: 100%; background: #8b5cf6; box-shadow: 0 0 10px rgba(139,92,246,.7);"></div>
  </div>

  <!-- Top bar (glass) -->
  <header style="position: absolute; top: 3px; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: rgba(11,10,16,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid #26233a; z-index: 5;">
    <a href="#" class="ib" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px;" title="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Frost Monarch · Ch. 301</div>
    <a href="#" class="ib" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px;" title="Comments">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-5A8 8 0 1 1 21 12z"></path></svg>
    </a>
  </header>

  <!-- Reading strip: pages stacked with zero gap -->
  <div style="position: absolute; top: 55px; left: 0; right: 0; display: flex; flex-direction: column; gap: 0;">
    <div style="height: 74px; background: linear-gradient(180deg, #14121b 0%, #1a1726 100%); position: relative;">
      <div style="position: absolute; left: 18px; right: 18px; top: 0; bottom: 14px; border: 1px solid rgba(255,255,255,.035); border-top: 0; border-radius: 0 0 4px 4px;"></div>
    </div>
    <div style="height: 363px; background: linear-gradient(180deg, #17141f 0%, #1c1828 45%, #14121b 100%); position: relative; border-top: 1px solid rgba(255,255,255,.05);">
      <div style="position: absolute; left: 18px; right: 18px; top: 14px; bottom: 14px; border: 1px solid rgba(255,255,255,.035); border-radius: 4px; background: radial-gradient(120% 70% at 50% 20%, rgba(139,92,246,.07), rgba(139,92,246,0) 60%);"></div>
      <div style="position: absolute; left: 36px; top: 32px; width: 150px; height: 118px; border-radius: 3px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.03);"></div>
      <div style="position: absolute; right: 36px; top: 32px; width: 132px; height: 118px; border-radius: 3px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.03);"></div>
      <div style="position: absolute; left: 36px; right: 36px; top: 166px; height: 150px; border-radius: 3px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.03);"></div>
      <div style="position: absolute; right: 26px; bottom: 22px; font-size: 14px; font-weight: 500; color: rgba(162,156,186,.45);">Page 7 / 34</div>
    </div>
  </div>

  <!-- Ad: after the last page, above the Next control -->
  <div style="position: absolute; top: 504px; left: 45px; width: 300px; height: 250px; border: 1px dashed #3d3860; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-variant: small-caps; letter-spacing: 0.06em; color: #a29cba; background: rgba(255,255,255,.015);">AD · 300×250</div>

  <!-- Floating chapter control (glass pill) -->
  <nav style="position: absolute; left: 24px; right: 24px; bottom: 16px; height: 56px; border-radius: 28px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: rgba(29,26,40,.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 12px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4); z-index: 5;">
    <a href="#" class="pill-btn" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 12px 0 8px; border-radius: 22px; font-size: 14px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      Prev
    </a>
    <a href="#" class="pill-sel" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 22px; background: rgba(139,92,246,.14); font-size: 14px; font-weight: 600;">
      Chapter 301
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </a>
    <a href="#" class="pill-btn" style="display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 12px; border-radius: 22px; font-size: 14px; font-weight: 600;">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
</body>
</html>
