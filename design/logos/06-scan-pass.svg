  <title id="t06">PALScans logo concept 06 - Scan Pass</title>
  <!-- A page caught mid-scan. Solid where the pass has finished, breaking into raster lines
       below it, with the gold beam sweeping the whole disc at the boundary. The beam sits in
       the page's own gutter, so gold never overlaps white. -->
