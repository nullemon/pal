  <g fill="#ffffff">
    <path d="M194 92 H318 Q336 92 336 110 V242 H176 V110 Q176 92 194 92 Z"/>
    <rect x="176" y="298" width="160" height="30"/>
    <rect x="176" y="342" width="160" height="30"/>
    <path d="M176 386 H336 V404 Q336 422 318 422 H194 Q176 422 176 404 Z"/>
  </g>
  <rect x="56" y="256" width="400" height="28" rx="14" fill="#f5c451"/>
</svg>
